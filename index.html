<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B1A" />
    <meta name="description" content="Vendas, comissões e financeiro da Souza Imobiliária." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Souza Imobiliária" />
    <title>Souza Imobiliária · Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      As fontes do Souza OS, e mais nenhuma:
        Sora  400–800 — título e número (font-heading)
        Inter 300–800 — rótulo e corpo (font-label, font-sans)
      O guia carrega por @import no CSS. Aqui vai por <link> com preconnect: é
      o mesmo arquivo do Google Fonts, com o mesmo resultado, mas o navegador
      começa a baixar a letra enquanto lê o HTML, sem esperar o CSS chegar.
      A pintura com a letra certa sai mais cedo, e o corretor abre isto em 4G.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <script>
      // ANTI-FLASH. Roda antes de qualquer pintura, para a tela não piscar no
      // tema errado enquanto o React carrega.
      //
      // O ESCURO É O PADRÃO DA CASA (o mesmo do iCRM), não a preferência do
      // sistema operacional. Só 'light' salvo põe a classe html.light; qualquer
      // outro valor, ou nada salvo, fica escuro. A densidade segue a mesma
      // regra: só 'compacta' salvo põe html.compacta.
      (function () {
        var html = document.documentElement
        try {
          var claro = localStorage.getItem('sgf.theme') === 'light'
          if (claro) html.classList.add('light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', claro ? '#F6F3EC' : '#070B1A')
        } catch (e) {}
        try {
          if (localStorage.getItem('sgf.densidade') === 'compacta') html.classList.add('compacta')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
