<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F6FB" />
    <title>Kit visual — Souza Imobiliária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Mesmas fontes do index.html (Plus Jakarta Sans, Geist e Instrument Serif), pelo mesmo
      motivo: <link> com preconnect em vez do @import do guia pinta mais cedo.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <script>
      // Anti-flash igual ao do index.html: escuro por padrão, html.light só com
      // 'light' salvo, html.compacta só com 'compacta' salvo.
      (function () {
        var html = document.documentElement
        try {
          var claro = localStorage.getItem('sgf.tema') !== 'dark'
          if (claro) html.classList.add('light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', claro ? '#F3F6FB' : '#0B1426')
        } catch (e) {}
        try {
          if (localStorage.getItem('sgf.densidade') === 'compacta') html.classList.add('compacta')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kit/main.tsx"></script>
  </body>
</html>
